services:
  backend:
    build: .
    ports: ['8000:8000']
    env_file: .env
    volumes: ['./data:/app/data','./chroma_data:/app/chroma_data']
  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes: ['.:/app']
    command: sh -c 'pip install -r requirements.txt && streamlit run frontend/streamlit_app.py --server.address=0.0.0.0'
    environment:
      API_URL: http://backend:8000
    ports: ['8501:8501']
    depends_on: [backend]
